name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
  pull_request:
    branches:
      - main

jobs:
  desktop-windows:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build desktop
        run: npm run build

      - name: Rebuild native dependency for Electron
        run: npm run rebuild:native

      - name: Electron smoke test
        run: npm run smoke

      - name: Package Windows portable
        run: npm run package:portable

      - name: Verify portable artifacts
        run: npm run verify:portable

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: PageAuto-portable-${{ github.sha }}
          path: dist/PageAuto-*-win-x64.zip
          if-no-files-found: error
          retention-days: 7
