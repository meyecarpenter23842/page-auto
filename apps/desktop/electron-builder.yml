appId: com.pageauto.desktop
productName: PageAuto

asar: true
compression: normal
npmRebuild: true

directories:
  output: ../../dist
  buildResources: resources

files:
  - out/**/*
  - package.json

asarUnpack:
  - node_modules/better-sqlite3/**/*

extraResources:
  - from: resources/app-icon.png
    to: app-icon.png

win:
  executableName: PageAuto
  icon: resources/app-icon.png
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: PageAuto
  artifactName: PageAuto-Setup-${version}.${ext}

artifactName: PageAuto-${version}-win-${arch}.${ext}
